<!doctype html>
<html lang="nl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>De Slimste Mens - Dashboard</title>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/index.css" />
  <style>
  </style>
</head>

<body>
  <div class="container">
    <h1>De Slimste Mens</h1>
    <div class="grid">
      <div class="card">
        <div style="height:8px"></div>

        <div>
          <label>Aantal spelers</label>
          <select id="playerCountSelect">
            <option value="1">1 speler (solo)</option>
            <option value="2">2 spelers</option>
            <option value="3" selected>3 spelers (standaard)</option>
          </select>
        </div>

        <div id="singlePlayerOptions" style="display:none;margin-top:10px;">
          <label>Vragen per ronde (alleen 1 speler)</label>
          <select id="questionsPerRoundSelect">
            <option value="1" selected>1 vraag per ronde</option>
            <option value="3">3 vragen per ronde</option>
          </select>
        </div>

        <div style="margin-top:10px;">
          <label>
            <input type="checkbox" id="bumpersEnabledCheckbox" checked />
            Rondebumpers tonen
          </label>
        </div>

                <div style="margin-top:10px;">
          <label>
            <input type="checkbox" id="scoreboardEnabledCheckbox" checked />
            Tussenstand tonen (optioneel)
          </label>
        </div>

        <div style="margin-top:10px;">
          <label>
            <input type="checkbox" id="safeRoundNavigationCheckbox" />
            Veilige rondeknoppen (voorkom vroegtijdig afkappen)
          </label>
        </div>

        <hr class="divider" />

        <div>
          <label>
            <input type="checkbox" id="presenterEnabledCheckbox" />
            Presentator tonen (optioneel)
          </label>
          <div id="presenterOptions" style="display:none;margin-top:10px;">
            <label>Upload presentatorfoto (verplicht):</label>
            <input id="presenterPhoto" type="file" accept="image/*" />
            <div id="presenterPhotoStatus" style="font-size:0.85em;color:#666;margin-top:5px;"></div>
          </div>
        </div>

        <div style="margin-top:10px;">
          <label>
            <input type="checkbox" id="juryEnabledCheckbox" />
            Jury tonen (optioneel)
          </label>
          <div id="juryOptions" style="display:none;margin-top:10px;">
            <label for="juryTypeSelect">Jurybeeld:</label>
            <select id="juryTypeSelect">
              <option value="standard">Standaardjury</option>
              <option value="custom">Aangepast jurylid</option>
            </select>
            <div id="juryPhotoOptions" style="display:none;margin-top:10px;">
              <label for="juryPhoto">Upload afbeelding jurylid:</label>
              <input id="juryPhoto" type="file" accept="image/*" />
              <div id="juryPhotoStatus" style="font-size:0.85em;color:#666;margin-top:5px;"></div>
            </div>
          </div>
        </div>

        <hr class="divider" />

        <div>
          <label>
            <input type="checkbox" id="introEnabledCheckbox" />
            Intro en Outro afspelen
          </label>
          <div id="introOptions" style="display:none;margin-top:10px;">
            <label>Intro-tekst:</label>
            <input id="introText" type="text" placeholder="Optionele intro-tekst..." />
            <div style="font-size:0.85em;color:#666;margin-top:5px;">Dit tekst verschijnt tijdens de intro video</div>
          </div>
        </div>

        <hr class="divider" />

        <label>Voer kandidaatnamen in</label>
        <div id="playersInputs" class="players-list">
          <div class="player-entry">
            <input class="playerName" data-index="0" value="Kandidaat A" />
            <input class="playerPhoto" type="file" accept="image/*" data-index="0" />
            <div class="playerPhotoStatus" data-index="0" style="font-size:0.8em;color:#666;"></div>
          </div>
          <div class="player-entry">
            <input class="playerName" data-index="1" value="Kandidaat B" />
            <input class="playerPhoto" type="file" accept="image/*" data-index="1" />
            <div class="playerPhotoStatus" data-index="1" style="font-size:0.8em;color:#666;"></div>
          </div>
          <div class="player-entry">
            <input class="playerName" data-index="2" value="Kandidaat C" />
            <input class="playerPhoto" type="file" accept="image/*" data-index="2" />
            <div class="playerPhotoStatus" data-index="2" style="font-size:0.8em;color:#666;"></div>
          </div>
        </div>

        <div class="controls">
          <button id="applyBtn">Maak spel</button>
          <button id="resetBtn" class="secondary">Reset</button>
        </div>

        <hr class="divider" />
        <div>
          <label>Startseconden per kandidaat</label>
          <input id="startSeconds" type="number" min="10" value="60" />
        </div>

        <hr class="divider" />
        <div>
          <label for="rulesetSelect">Spelregels</label>
          <select id="rulesetSelect">
            <option value="flemish" selected>Vlaams - De Slimste Mens ter Wereld</option>
            <option value="dutch">Nederlands - De Slimste Mens</option>
          </select>
        </div>

        <div style="height:8px"></div>
        <div>
          <label>Aantal vragen 3-6-9</label>
          <input id="threeSixNineCount" type="number" min="1" max="50" value="12" />
        </div>

        <div style="height:8px"></div>
        <div>
          <label>Foto's in Galerij-ronde</label>
          <select id="galerijPhotoCount">
            <option value="10" selected>10 (standaard)</option>
            <option value="8">8</option>
          </select>
        </div>

        <hr class="divider" />
        <div>
          <label>Collectief Geheugen eindinstelling:</label>
          <select id="collectiefEndOption">
            <option value="lowestOut">Laagste score valt af, overige gaan naar finale</option>
            <option value="highestWinner">Hoogste score Slimste van de Dag, overige naar finale</option>
          </select>
        </div>

      </div>

      <!-- Midden: spel interface -->
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div class="small">Huidige ronde</div>
            <div id="currentRound" class="big">—</div>
            <div class="small">Spelers: <span id="playerCount">0</span></div>
          </div>
        </div>

        <hr class="divider" />

        <div id="playersArea" class="player-row"></div>

        <div class="button-row">
          <button id="startRound">Start ronde</button>
          <button id="nextRound" class="secondary">Volgende ronde</button>
        </div>

        <div id="introControlArea" class="button-row" style="display:none;margin-top:10px;">
          <button id="startIntroBtn" class="secondary">Start Intro</button>
          <button id="playIntroVideo" class="secondary" style="display:none;">▶️ Speel Video</button>
          <button id="introPerspectiveFull" class="secondary" style="display:none;">Volledig Lobby</button>
          <button id="introPerspectiveCand1" class="secondary" style="display:none;">Kandidaat 1</button>
          <button id="introPerspectiveCand2" class="secondary" style="display:none;">Kandidaat 2</button>
          <button id="introPerspectiveCand3" class="secondary" style="display:none;">Kandidaat 3</button>
          <button id="stopIntroBtn" class="secondary" style="display:none;">⏹️ Stop Intro</button>
        </div>

        <div id="introScriptArea"
          style="display:none;margin-top:10px;padding:15px;background:#2a2a2a;border-radius:8px;border:2px solid #ffd17a;">
          <strong id="introScriptTitle" style="color:#ffd17a;display:block;margin-bottom:8px;">Presentator script:</strong>
          <div id="introScriptText" style="color:#fff;font-size:1.1em;line-height:1.5;"></div>
        </div>

        <div id="presenterControlArea" class="button-row" style="display:none;margin-top:10px;">
          <button id="togglePresenterView" class="secondary">Wissel naar Presentator</button>
        </div>

        <div id="juryControlArea" class="button-row" style="display:none;margin-top:10px;">
          <button id="toggleJuryView" class="secondary">Wissel naar Jury</button>
        </div>


        <div id="scoreboardControlArea" class="button-row" style="display:none;margin-top:10px;">
          <button id="toggleScoreboardView" class="secondary">Toon tussenstand</button>
          <button id="lobbyStartScoreRevealBtn" class="secondary" style="display:none;">Toon startscore</button>
        </div>

        <div class="question-area" id="currentQuestion">
          <em>Hier verschijnt de vraag en media — (nog geen vragen geladen)</em>
        </div>


        <div style="margin-top:10px;" id="roundControls"></div>
        <div style="margin-top:10px;" id="preFinaleBonusControls" class="button-row"></div>

      </div>

      <!-- Rechts: custom game en audio -->
      <div class="card">
        <div>
          <h4>Configuratie</h4>
          <label>Upload aangepast game config bestand (.json of .zip):</label>
          <input id="configUpload" type="file" accept=".json,.zip,application/json,application/zip" />
          <div class="controls">
            <button id="uploadConfigBtn" class="secondary">Configuratie laden</button>
            <button id="downloadConfigBtn" class="secondary">Huidige config downloaden</button>
          </div>
          <div class="controls">
            <button id="openConfigBuilderBtn" class="secondary">Custom game maken</button>
          </div>
          <div class="controls">
            <button id="openDisplayBtn" class="secondary">Display openen</button>
          </div>
          <div id="configStatus" style="font-size:0.85em;color:#666;margin-top:5px;"></div>
        </div>

        <hr class="divider" />
        <div>
          <h4>Audio</h4>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button id="playBumper">Bumper</button>
            <button id="playSting">Sting</button>
            <button id="stopKlokFout" class="secondary">Antwoord fout</button>
            <button id="playKlokEind" class="secondary">Klok eind</button>
            <button id="playGoed">Antwoord goed</button>
            <button id="playFinaleBumper">Finale Bumper</button>
            <button id="playApplause">Applaus</button>
          </div>
        </div>
      </div>

    </div>
  </div>
  <script src="node_modules/jszip/dist/jszip.min.js"></script>
  <script src="js/config-manager.js"></script>
  <script src="js/questions/vragen-369.js"></script>
  <script src="js/rounds/round-3-6-9.js"></script>
  <script src="js/questions/vragen-opendeur.js"></script>
  <script src="js/rounds/round-opendeur.js"></script>
  <script src="js/questions/vragen-puzzel.js"></script>
  <script src="js/rounds/round-puzzel.js"></script>
  <script src="js/questions/vragen-galerij.js"></script>
  <script src="js/rounds/round-galerij.js"></script>
  <script src="js/core.js"></script>
  <script src="js/questions/vragen-collectiefgeheugen.js"></script>
  <script src="js/rounds/round-collectiefgeheugen.js"></script>
  <script src="js/questions/vragen-finale.js"></script>
  <script src="js/rounds/round-finale.js"></script>
  <script>
    // Wrap alle event listeners in DOMContentLoaded voor betere null-safety
    document.addEventListener('DOMContentLoaded', function () {

      // Config Upload/Download Event Listeners
      const uploadConfigBtn = document.getElementById('uploadConfigBtn');
      if (uploadConfigBtn) {
        uploadConfigBtn.addEventListener('click', async () => {
          const fileInput = document.getElementById('configUpload');
          if (!fileInput.files.length) {
            alert('Selecteer eerst een JSON of ZIP bestand');
            return;
          }

          try {
            const file = fileInput.files[0];
            const loadedConfig = await uploadConfigFile(file);
            const warnings = Array.isArray(loadedConfig?._mediaWarnings) ? loadedConfig._mediaWarnings : [];
            const zipUnresolved = Array.isArray(loadedConfig?._zipUnresolvedPaths) ? loadedConfig._zipUnresolvedPaths : [];
            const configStatusEl = document.getElementById('configStatus');

            if (warnings.length > 0) {
              const warningPreview = warnings.slice(0, 2).join(' | ');
              configStatusEl.textContent =
                `⚠ Configuratie geladen met ${warnings.length} media-waarschuwing(en). Voorbeeld: ${warningPreview}`;
              flash(`Configuratie geladen, maar ${warnings.length} media-pad(en) zijn ongeldig. Controleer Galerij/Collectief.`, 'wrong');
            } else {
              if (zipUnresolved.length > 0) {
                console.warn('ZIP media niet gevonden:', zipUnresolved);
              }
              configStatusEl.textContent =
                `✓ Configuratie geladen: "${gameConfig.metadata?.name || 'Onbekend'}"`;
              flash('Configuratie succesvol geladen!', 'good');
            }
          } catch (error) {
            document.getElementById('configStatus').textContent = `✗ Fout: ${error.message}`;
            flash(`Fout bij laden: ${error.message}`, 'wrong');
          }
        });
      }

      const downloadConfigBtn = document.getElementById('downloadConfigBtn');
      if (downloadConfigBtn) {
        downloadConfigBtn.addEventListener('click', () => {
          downloadConfigFile();
          flash('Configuratie gedownload!', 'good');
        });
      }

      const openConfigBuilderBtn = document.getElementById('openConfigBuilderBtn');
      if (openConfigBuilderBtn) {
        openConfigBuilderBtn.addEventListener('click', () => {
          const popup = window.open('custom-game-builder.html', '_blank', 'noopener,noreferrer,width=1400,height=900');
          if (!popup) {
            // alert('Kon builder venster niet openen. Controleer of popups zijn toegestaan.');
            return;
          }

          popup.focus();
        });
      }

      const openDisplayBtn = document.getElementById('openDisplayBtn');
      const isElectronApp = !!(window && window.slimstemensDesktopBridge);
      if (openDisplayBtn) {
        if (isElectronApp) {
          openDisplayBtn.style.display = 'none';
        } else {
          openDisplayBtn.addEventListener('click', () => {
            const popup = window.open('display.html', 'width=1400,height=900');
            if (!popup) {
              alert('Kon display venster niet openen. Controleer of popups zijn toegestaan.');
              return;
            }

            // popup.focus();
          });
        }
      }

      // Player count selector logic
      const playerCountSelect = document.getElementById('playerCountSelect');
      if (playerCountSelect) {
        playerCountSelect.addEventListener('change', function () {
          const count = parseInt(this.value);
          const playerEntries = document.querySelectorAll('.player-entry');
          const singlePlayerOptions = document.getElementById('singlePlayerOptions');

          // Toon/verberg solo opties
          if (count === 1) {
            singlePlayerOptions.style.display = 'block';
          } else {
            singlePlayerOptions.style.display = 'none';
          }

          // Toon/verberg speler inputs
          playerEntries.forEach((entry, i) => {
            if (i < count) {
              entry.style.display = 'flex';
            } else {
              entry.style.display = 'none';
            }
          });
        });
      }

      const rulesetSelect = document.getElementById('rulesetSelect');
      const threeSixNineInput = document.getElementById('threeSixNineCount');
      if (threeSixNineInput) {
        threeSixNineInput.addEventListener('change', function () {
          const count = parseInt(this.value, 10);
          if (typeof setThreeSixNineMax === 'function') {
            setThreeSixNineMax(count);
          }

          if (typeof gameConfig !== 'undefined' && gameConfig && !isNaN(count) && count > 0) {
            gameConfig.settings = gameConfig.settings || {};
            gameConfig.settings.threeSixNine = gameConfig.settings.threeSixNine || {};
            gameConfig.settings.threeSixNine.maxQuestions = count;
          }
        });
      }

      if (rulesetSelect) {
        rulesetSelect.addEventListener('change', function () {
          const isDutchRules = this.value === 'dutch';
          const threeSixNineCount = isDutchRules ? 15 : 12;
          const galerijPhotoCount = isDutchRules ? 8 : 10;
          const threeSixNineInput = document.getElementById('threeSixNineCount');
          const galerijPhotoSelect = document.getElementById('galerijPhotoCount');

          if (threeSixNineInput) threeSixNineInput.value = threeSixNineCount;
          if (typeof setThreeSixNineMax === 'function') {
            setThreeSixNineMax(threeSixNineCount);
          }
          if (galerijPhotoSelect) {
            galerijPhotoSelect.value = galerijPhotoCount;
            galerijPhotoSelect.dispatchEvent(new Event('change'));
          }

          if (typeof gameConfig !== 'undefined' && gameConfig) {
            gameConfig.settings = gameConfig.settings || {};
            gameConfig.settings.threeSixNine = gameConfig.settings.threeSixNine || {};
            gameConfig.settings.threeSixNine.maxQuestions = threeSixNineCount;
            gameConfig.settings.galerij = gameConfig.settings.galerij || {};
            gameConfig.settings.galerij.photoCount = galerijPhotoCount;
          }
        });
      }

      // Presentator functie event listeners
      let presenterEnabled = false;
      let presenterPhotoData = null;
      let showingPresenter = false;
      let juryEnabled = false;
      let showingJury = false;
      let juryMode = 'standard';
      let juryPhotoData = null;
      let scoreboardEnabled = true;
      let showingScoreboard = false;
      let showingLobbyScoreboard = false;

      const presenterCheckbox = document.getElementById('presenterEnabledCheckbox');
      if (presenterCheckbox) {
        presenterCheckbox.addEventListener('change', function () {
          presenterEnabled = this.checked;
          const presenterOptions = document.getElementById('presenterOptions');
          const presenterControlArea = document.getElementById('presenterControlArea');

          if (presenterEnabled) {
            presenterOptions.style.display = 'block';
          } else {
            presenterOptions.style.display = 'none';
            presenterControlArea.style.display = 'none';
            presenterPhotoData = null;
            document.getElementById('presenterPhotoStatus').textContent = '';
            showingPresenter = false;
            const togglePresenterBtn = document.getElementById('togglePresenterView');
            if (togglePresenterBtn) togglePresenterBtn.textContent = 'Wissel naar Presentator';
            if (typeof sendDisplayUpdate !== 'undefined') {
              sendDisplayUpdate({ type: 'presenter_toggle', showing: false, photoData: null });
            }
          }
        });
      }

      const juryCheckbox = document.getElementById('juryEnabledCheckbox');
      const juryTypeSelect = document.getElementById('juryTypeSelect');
      const juryPhotoInput = document.getElementById('juryPhoto');
      const juryOptions = document.getElementById('juryOptions');
      const juryPhotoOptions = document.getElementById('juryPhotoOptions');

      function updateJuryOptions() {
        if (juryOptions) juryOptions.style.display = juryEnabled ? 'block' : 'none';
        if (juryPhotoOptions) juryPhotoOptions.style.display = juryMode === 'custom' ? 'block' : 'none';
      }

      function sendJuryToggle(showing) {
        if (typeof sendDisplayUpdate !== 'undefined') {
          sendDisplayUpdate({
            type: 'jury_toggle',
            showing,
            mode: juryMode,
            photoData: juryPhotoData
          });
        }
      }

      if (juryCheckbox) {
        juryCheckbox.addEventListener('change', function () {
          juryEnabled = this.checked;
          const juryControlArea = document.getElementById('juryControlArea');
          updateJuryOptions();

          if (juryEnabled) {
            juryControlArea.style.display = 'flex';
          } else {
            juryControlArea.style.display = 'none';
            showingJury = false;
            const toggleJuryBtn = document.getElementById('toggleJuryView');
            if (toggleJuryBtn) toggleJuryBtn.textContent = 'Wissel naar Jury';
            sendJuryToggle(false);
          }
        });
      }

      if (juryTypeSelect) {
        juryTypeSelect.addEventListener('change', function () {
          juryMode = this.value;
          updateJuryOptions();
          if (showingJury && (juryMode === 'standard' || juryPhotoData)) sendJuryToggle(true);
        });
      }

      if (juryPhotoInput) {
        juryPhotoInput.addEventListener('change', function () {
          const file = this.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = function (event) {
            juryPhotoData = event.target.result;
            const status = document.getElementById('juryPhotoStatus');
            if (status) {
              status.textContent = '✓ Afbeelding geladen: ' + file.name;
              status.style.color = '#4ade80';
            }
            if (showingJury && juryMode === 'custom') sendJuryToggle(true);
          };
          reader.readAsDataURL(file);
        });
      }

      const scoreboardCheckbox = document.getElementById('scoreboardEnabledCheckbox');
      const scoreboardControlArea = document.getElementById('scoreboardControlArea');
      const toggleScoreboardBtn = document.getElementById('toggleScoreboardView');
      const lobbyStartScoreRevealBtn = document.getElementById('lobbyStartScoreRevealBtn');
      function dismissScoreboard(deferUntilNextUpdate = false) {
        if (!showingScoreboard) return;

        showingScoreboard = false;
        showingLobbyScoreboard = false;
        if (toggleScoreboardBtn) toggleScoreboardBtn.textContent = 'Toon tussenstand';
        if (lobbyStartScoreRevealBtn) lobbyStartScoreRevealBtn.style.display = 'none';
        if (deferUntilNextUpdate && typeof deferScoreboardDismissal === 'function') {
          deferScoreboardDismissal();
        } else if (typeof sendDisplayUpdate !== 'undefined') {
          sendDisplayUpdate({ type: 'scoreboard_toggle', showing: false });
        }
      }

      window.dismissScoreboard = dismissScoreboard;

      document.addEventListener('click', function (event) {
        const clickedButton = event.target instanceof Element ? event.target.closest('button') : null;
        if (!showingScoreboard || !clickedButton ||
            clickedButton === toggleScoreboardBtn ||
            clickedButton === lobbyStartScoreRevealBtn) return;

        dismissScoreboard(true);
      }, true);

      if (lobbyStartScoreRevealBtn) {
        lobbyStartScoreRevealBtn.addEventListener('click', function () {
          if (!showingLobbyScoreboard) return;

          showingLobbyScoreboard = false;
          lobbyStartScoreRevealBtn.style.display = 'none';
          if (typeof sendDisplayUpdate !== 'undefined') {
            sendDisplayUpdate({ type: 'lobby_standings_reveal' });
          }
          if (typeof playSFX === 'function') playSFX('SFX/goed.mp3');
        });
      }

      if (scoreboardCheckbox) {
        scoreboardEnabled = scoreboardCheckbox.checked;
        if (scoreboardControlArea) {
          scoreboardControlArea.style.display = scoreboardEnabled ? 'flex' : 'none';
        }
        scoreboardCheckbox.addEventListener('change', function () {
          scoreboardEnabled = this.checked;
          if (scoreboardControlArea) {
            scoreboardControlArea.style.display = scoreboardEnabled ? 'flex' : 'none';
          }
          if (!scoreboardEnabled && showingScoreboard) {
            showingScoreboard = false;
            showingLobbyScoreboard = false;
            if (toggleScoreboardBtn) toggleScoreboardBtn.textContent = 'Toon tussenstand';
            if (lobbyStartScoreRevealBtn) lobbyStartScoreRevealBtn.style.display = 'none';
            if (typeof sendDisplayUpdate !== 'undefined') {
              sendDisplayUpdate({ type: 'scoreboard_toggle', showing: false });
            }
          }
        });
      }

      // Intro functie event listeners
      const introCheckbox = document.getElementById('introEnabledCheckbox');
      if (introCheckbox) {
        introCheckbox.addEventListener('change', function () {
          introEnabled = this.checked;
          outroEnabled = this.checked; // Outro volgt intro instelling
          console.log('🎬 Intro/Outro checkbox changed:', { intro: introEnabled, outro: outroEnabled });

          const introOptions = document.getElementById('introOptions');

          if (introEnabled) {
            introOptions.style.display = 'block';
          } else {
            introOptions.style.display = 'none';
            introText = '';
          }
        });
      }

      const introTextInput = document.getElementById('introText');
      if (introTextInput) {
        introTextInput.addEventListener('change', function () {
          introText = this.value || '';
          console.log('🎬 Intro tekst gewijzigd:', introText);
        });
      }

      const presenterPhotoInput = document.getElementById('presenterPhoto');
      if (presenterPhotoInput) {
        presenterPhotoInput.addEventListener('change', function () {
          const file = this.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = function (e) {
            presenterPhotoData = e.target.result;
            document.getElementById('presenterPhotoStatus').textContent = '✓ Foto geladen: ' + file.name;
            document.getElementById('presenterPhotoStatus').style.color = '#4ade80';
          };
          reader.readAsDataURL(file);
        });
      }

      // Helper functie om presentator controls te tonen/verbergen
      function updatePresenterControls() {
        const presenterControlArea = document.getElementById('presenterControlArea');
        if (presenterEnabled && presenterPhotoData) {
          presenterControlArea.style.display = 'flex';
        } else {
          presenterControlArea.style.display = 'none';
        }
      }

      function updateJuryControls() {
        const juryControlArea = document.getElementById('juryControlArea');
        if (juryControlArea) {
          juryControlArea.style.display = juryEnabled ? 'flex' : 'none';
        }
      }

      function applyUiSettingsFromConfig(config) {
        if (!config || !config.settings) {
          return;
        }

        console.log('⚙️ Laden config instellingen...');

        // Presentator instellingen
        const presenterSettings = config.settings.presenter;
        if (presenterSettings) {
          if (presenterCheckbox && presenterSettings.enabled !== undefined) {
            presenterCheckbox.checked = !!presenterSettings.enabled;
            presenterCheckbox.dispatchEvent(new Event('change'));
          }

          const presenterPhotoValue = presenterSettings.photoData || presenterSettings.photoUrl;
          if (presenterPhotoValue) {
            presenterPhotoData = presenterPhotoValue;
            const status = document.getElementById('presenterPhotoStatus');
            if (status) {
              const presenterValueText = String(presenterPhotoValue);
              const label = presenterValueText.startsWith('data:')
                ? 'Data URI'
                : presenterValueText.split('/').pop();
              status.textContent = '✓ Foto vastgezet via config: ' + label;
              status.style.color = '#4ade80';
            }
          }
        }

        // Jury instellingen
        const jurySettings = config.settings.jury;
        if (jurySettings) {
          juryMode = jurySettings.type === 'custom' ? 'custom' : 'standard';
          if (juryTypeSelect) {
            juryTypeSelect.value = juryMode;
          }
          juryPhotoData = jurySettings.photoData || jurySettings.photoUrl || null;
          const juryPhotoStatus = document.getElementById('juryPhotoStatus');
          if (juryPhotoStatus) {
            const juryPhotoValue = String(juryPhotoData || '');
            if (juryPhotoValue) {
              const label = juryPhotoValue.startsWith('data:')
                ? 'Data URI'
                : juryPhotoValue.split('/').pop();
              juryPhotoStatus.textContent = '✓ Foto vastgezet via config: ' + label;
              juryPhotoStatus.style.color = '#4ade80';
            } else {
              juryPhotoStatus.textContent = '';
            }
          }
          updateJuryOptions();
          if (juryCheckbox && jurySettings.enabled !== undefined) {
            juryCheckbox.checked = !!jurySettings.enabled;
            juryCheckbox.dispatchEvent(new Event('change'));
          }
        }

        const scoreboardSettings = config.settings.scoreboard;
        if (scoreboardSettings && scoreboardCheckbox && scoreboardSettings.enabled !== undefined) {
          scoreboardCheckbox.checked = !!scoreboardSettings.enabled;
          scoreboardCheckbox.dispatchEvent(new Event('change'));
        }

        // Bumpers instelling
        const bumpersSettings = config.settings.bumpers;
        if (bumpersSettings && bumpersSettings.enabled !== undefined) {
          const bumpersCheckbox = document.getElementById('bumpersEnabledCheckbox');
          if (bumpersCheckbox) {
            bumpersCheckbox.checked = !!bumpersSettings.enabled;
          }
        }

        // Veilige rondeknoppen
        const safeRoundNavigationSettings = config.settings.safeRoundNavigation;
        if (safeRoundNavigationSettings && safeRoundNavigationSettings.enabled !== undefined) {
          const safeCheckbox = document.getElementById('safeRoundNavigationCheckbox');
          if (safeCheckbox) {
            safeCheckbox.checked = !!safeRoundNavigationSettings.enabled;
            safeCheckbox.dispatchEvent(new Event('change'));
          }
        }

        // Intro / Outro instellingen
        const introSettings = config.settings.intro;
        if (introSettings) {
          if (introCheckbox && introSettings.enabled !== undefined) {
            introCheckbox.checked = !!introSettings.enabled;
            introCheckbox.dispatchEvent(new Event('change'));
          }

          if (typeof introSettings.text === 'string') {
            const introTextInput = document.getElementById('introText');
            if (introTextInput) {
              introTextInput.value = introSettings.text;
            }
            introText = introSettings.text;
          }
        }

        const outroSettings = config.settings.outro;
        if (outroSettings && outroSettings.enabled !== undefined) {
          outroEnabled = !!outroSettings.enabled;
        }

        if (typeof window.applyPresenterScriptsSettings === 'function') {
          window.applyPresenterScriptsSettings(config.settings.presenterScripts || null);
        }

        // Startseconden
        if (config.settings.game && config.settings.game.startSeconds !== undefined) {
          const startSecondsInput = document.getElementById('startSeconds');
          const parsedStartSeconds = parseInt(config.settings.game.startSeconds, 10);
          if (startSecondsInput && !isNaN(parsedStartSeconds) && parsedStartSeconds >= 10) {
            startSecondsInput.value = parsedStartSeconds;
          }
        }

        // Collectief Geheugen eindinstelling
        if (config.settings.collectief && config.settings.collectief.endOption) {
          const collectiefEndSelect = document.getElementById('collectiefEndOption');
          if (collectiefEndSelect) {
            collectiefEndSelect.value = config.settings.collectief.endOption;
            collectiefEndSelect.dispatchEvent(new Event('change'));
          }
        }

        // Kandidaten instellingen
        const playerModeSettings = config.settings.playerMode;
        if (playerModeSettings) {
          // Zet playerCount
          const playerCountSelect = document.getElementById('playerCountSelect');
          if (playerCountSelect && playerModeSettings.playerCount) {
            playerCountSelect.value = playerModeSettings.playerCount;
            playerCountSelect.dispatchEvent(new Event('change'));
          }

          // Zet questionsPerRound voor solo modus
          if (playerModeSettings.questionsPerRound) {
            const questionsPerRoundSelect = document.getElementById('questionsPerRoundSelect');
            if (questionsPerRoundSelect) {
              questionsPerRoundSelect.value = playerModeSettings.questionsPerRound;
            }
          }

          // Vul kandidaten namen en foto's automatisch in
          if (Array.isArray(playerModeSettings.players)) {
            for (const [index, player] of playerModeSettings.players.entries()) {
              if (index >= 3) continue; // Maximum 3 spelers

              // Vul naam in
              const nameInput = document.querySelector(`.playerName[data-index="${index}"]`);
              if (nameInput && player.name) {
                nameInput.value = player.name;
                console.log(`✓ Kandidaat ${index}: "${player.name}"`);
              }

              // Sla foto-path direct op (geen fetch nodig!)
              if (player.photoUrl) {
                // Controleer of het een data-URL is (base64)
                if (player.photoUrl.startsWith('data:')) {
                  storePlayerPhotoData(index, player.photoUrl);
                  console.log(`✓ Kandidaat ${index}: foto van data-URL`);
                } else {
                  // Pad naar bestand — opslaan zonder fetch
                  storePlayerPhotoData(index, player.photoUrl);
                  console.log(`✓ Kandidaat ${index}: foto-pad vastgezet (${player.photoUrl})`);
                }
              }
            }
          }
        }

        setTimeout(updatePresenterControls, 0);
        setTimeout(updateJuryControls, 0);
        console.log('✅ Config instellingen voltooid');
      }

      // Helper: sla foto-data op voor kandidaat
      function storePlayerPhotoData(index, photoData) {
        // Dit zal later gebruikt worden wanneer de speler gemaakt wordt
        if (!window.playerPhotosFromConfig) {
          window.playerPhotosFromConfig = {};
        }
        window.playerPhotosFromConfig[index] = photoData;

        // Update status display
        const statusEl = document.querySelector(`.playerPhotoStatus[data-index="${index}"]`);
        if (statusEl) {
          const photoDataText = String(photoData);
          const label = photoDataText.startsWith('data:') ? 'Data URI' : photoDataText.split('/').pop();
          statusEl.textContent = '✓ Foto via config: ' + label;
          statusEl.style.color = '#4ade80';
        }
      }

      // Helper: laad foto van pad en sla op (wacht tot FileReader klaar is)
      function loadAndStorePlayerPhoto(index, photoPath) {
        return new Promise((resolve) => {
          fetch(photoPath)
            .then((response) => {
              if (!response.ok) {
                console.error(`❌ Kandidaat ${index}: HTTP ${response.status} - ${photoPath}`);
                resolve();
                return;
              }
              return response.blob();
            })
            .then((blob) => {
              if (!blob) return;
              const reader = new FileReader();
              reader.onload = (e) => {
                storePlayerPhotoData(index, e.target.result);
                console.log(`✓ Kandidaat ${index}: foto voor config ingeladen`);
                resolve();
              };
              reader.onerror = () => {
                console.error(`❌ Kandidaat ${index}: FileReader fout`);
                resolve();
              };
              reader.readAsDataURL(blob);
            })
            .catch((error) => {
              console.error(`❌ Kandidaat ${index}: Kon foto niet laden van "${photoPath}":`, error.message);
              resolve();
            });
        });
      }

      window.applyUiSettingsFromConfig = applyUiSettingsFromConfig;
      if (window.pendingUiConfig) {
        applyUiSettingsFromConfig(window.pendingUiConfig);
      }

      // Helper functie om intro controls te tonen/verbergen
      function updateIntroControls() {
        const introControlArea = document.getElementById('introControlArea');
        if (introEnabled) {
          introControlArea.style.display = 'flex';
        } else {
          introControlArea.style.display = 'none';
        }
      }

      // Listener om presentator controls te updaten na het maken van een spel
      const applyBtn = document.getElementById('applyBtn');
      if (applyBtn) {
        applyBtn.addEventListener('click', function () {
          // Wacht even zodat het spel eerst gemaakt wordt
          setTimeout(updatePresenterControls, 100);
          setTimeout(updateIntroControls, 100);
          setTimeout(updateJuryControls, 100);
        });
      }

      const togglePresenterBtn = document.getElementById('togglePresenterView');
      if (togglePresenterBtn) {
        togglePresenterBtn.addEventListener('click', function () {
          if (!presenterEnabled || !presenterPhotoData) {
            alert('Upload eerst een presentatorfoto!');
            return;
          }

          showingPresenter = !showingPresenter;
          const btn = document.getElementById('togglePresenterView');
          btn.textContent = showingPresenter ? 'Wissel naar Kandidaten' : 'Wissel naar Presentator';

          if (showingPresenter) {
            showingJury = false;
            showingScoreboard = false;
            const juryBtn = document.getElementById('toggleJuryView');
            if (juryBtn) juryBtn.textContent = 'Wissel naar Jury';
            if (toggleScoreboardBtn) toggleScoreboardBtn.textContent = 'Toon tussenstand';
          }

          // Stuur WebSocket bericht naar display
          if (typeof sendDisplayUpdate !== 'undefined') {
            sendDisplayUpdate({
              type: 'presenter_toggle',
              showing: showingPresenter,
              photoData: presenterPhotoData
            });

            if (showingPresenter) {
              sendDisplayUpdate({
                type: 'jury_toggle',
                showing: false
              });
            }
          }
        });
      }

      const toggleJuryBtn = document.getElementById('toggleJuryView');
      if (toggleJuryBtn) {
        toggleJuryBtn.addEventListener('click', function () {
          if (!juryEnabled) {
            alert('Zet eerst "Jury tonen" aan.');
            return;
          }
          if (juryMode === 'custom' && !juryPhotoData) {
            alert('Upload eerst een afbeelding van het aangepaste jurylid.');
            return;
          }

          showingJury = !showingJury;
          const btn = document.getElementById('toggleJuryView');
          btn.textContent = showingJury ? 'Wissel naar Kandidaten' : 'Wissel naar Jury';

          if (showingJury) {
            showingPresenter = false;
            showingScoreboard = false;
            const presenterBtn = document.getElementById('togglePresenterView');
            if (presenterBtn) presenterBtn.textContent = 'Wissel naar Presentator';
            if (toggleScoreboardBtn) toggleScoreboardBtn.textContent = 'Toon tussenstand';
          }

          if (typeof sendDisplayUpdate !== 'undefined') {
            sendJuryToggle(showingJury);

            if (showingJury) {
              sendDisplayUpdate({
                type: 'presenter_toggle',
                showing: false,
                photoData: null
              });
            }
          }
        });
      }

      if (toggleScoreboardBtn) {
        toggleScoreboardBtn.addEventListener('click', function () {
          if (!scoreboardEnabled) return;

          showingScoreboard = !showingScoreboard;
          toggleScoreboardBtn.textContent = showingScoreboard ? 'Terug naar kandidaten' : 'Toon tussenstand';
          const currentRoundName = document.getElementById('currentRound')?.textContent.trim() || '';
          showingLobbyScoreboard = showingScoreboard && currentRoundName === '—';
          if (lobbyStartScoreRevealBtn) {
            lobbyStartScoreRevealBtn.style.display = showingLobbyScoreboard ? 'inline-block' : 'none';
          }

          if (showingScoreboard) {
            showingPresenter = false;
            showingJury = false;
            const presenterBtn = document.getElementById('togglePresenterView');
            const juryBtn = document.getElementById('toggleJuryView');
            if (presenterBtn) presenterBtn.textContent = 'Wissel naar Presentator';
            if (juryBtn) juryBtn.textContent = 'Wissel naar Jury';
          }

          if (typeof sendDisplayUpdate !== 'undefined') {
            if (showingScoreboard) {
              sendDisplayUpdate({ type: 'presenter_toggle', showing: false, photoData: null });
              sendDisplayUpdate({ type: 'jury_toggle', showing: false });
            }
            sendDisplayUpdate({
              type: 'scoreboard_toggle',
              showing: showingScoreboard,
              lobbyStandings: showingLobbyScoreboard,
              players,
              roundName: currentRoundName
            });
          }
        });
      }

    }); // Einde DOMContentLoaded
  </script>
</body>

</html>
